# =====================================================
# 📝 动态更新模板
# 使用方法：
#   1. 复制下面任意一条模板
#   2. 粘贴到 source/_data/dynamics.yml 的【最顶部】（第一条位置）
#   3. 修改 date 和 content
#   4. 保存（自动 push 到远端构建，刷新页面即可看到）
#
# ⚠️ 注意：新动态放最上面，日期从新到旧排列
# =====================================================

# —— 模板 1：纯文字动态（推荐）——
- date: 2026-08-15
  content: 今天干了件大事！🚀

# —— 模板 2：多行内容 / 带 Markdown（加粗、链接、列表、代码）——
- date: 2026-08-15
  content: |-
    支持 **Markdown** 语法：
    - 可以写 `代码`
    - 可以写 [链接](https://github.com)
    - 可以写列表

# —— 模板 3：代码块动态 ——
- date: 2026-08-15
  content: |-
    今天写了个脚本：
    ```js
    console.log("hello dynamic");
    ```

